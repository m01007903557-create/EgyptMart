 * - دعم HTML fallback للمتصفحات القديمة
 * - تحسينات SEO وإعدادات الأمان
 */

declare(strict_types=1);

// Enable error reporting for development (disable in production)
error_reporting(E_ALL);
ini_set('display_errors', '1');

// Set timezone
date_default_timezone_set('Africa/Cairo');

// Target URL
$targetUrl = 'http://hashlive.com/demo/welkin/index.php';

// Validate URL (optional - prevent open redirect vulnerabilities)
$allowedDomains = ['hashlive.com'];
$parsedUrl = parse_url($targetUrl);
$host = $parsedUrl['host'] ?? '';

if (!in_array($host, $allowedDomains, true)) {
    // Log potential security issue
    error_log("Redirect attempt to non-allowed domain: " . $host);
    
    // Fallback to safe redirect
    $targetUrl = 'index.php';
}

// Perform redirect with proper HTTP status code
header('HTTP/1.1 301 Moved Permanently');
header('Location: ' . $targetUrl);

// Fallback HTML for browsers that don't support redirect
?>

<html lang="en">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=<?php echo htmlspecialchars($targetUrl, ENT_QUOTES, 'UTF-8'); ?>">
    
    <!-- SEO Meta Tags -->
    <title>Redirecting...</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Redirecting to demo page">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="<?php echo htmlspecialchars($targetUrl, ENT_QUOTES, 'UTF-8'); ?>">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;

<body>
    <div class="container">
        <h1>Redirecting...</h1>
        
        <div class="loader"></div>
        
        <p>
            You are being redirected to the demo page.<br>
            If you are not redirected automatically, 
            <a href="<?php echo htmlspecialchars($targetUrl, ENT_QUOTES, 'UTF-8'); ?>">
                click here
            </a>.
        </p>
        
        <p>
            <small>Redirecting to: <?php echo htmlspecialchars($targetUrl, ENT_QUOTES, 'UTF-8'); ?></small>
        </p>
    </div>
    
    <!-- Fallback JavaScript redirect -->
    <script>
        (function() {
            // Fallback redirect using JavaScript
            setTimeout(function() {
                window.location.href = <?php echo json_encode($targetUrl); ?>;
            }, 100);
        })();
    </script>
